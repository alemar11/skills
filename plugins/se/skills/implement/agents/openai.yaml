interface:
  display_name: "🛠️ Implement"
  short_description: "Implement local work from a spec or ticket."
  brand_color: "#4338CA"
  default_prompt: "Use $se:implement to implement the selected spec or ticket in the current repository, validate the result, use independent review for substantial or risky changes when available, and commit only the required files to the current branch without publishing or deploying."
policy:
  allow_implicit_invocation: true
