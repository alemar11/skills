interface:
  display_name: "🧹 Deslop"
  short_description: "Audit and safely remove low-value repository code."
  default_prompt: "Audit this repository for low-value code: redundant tests, trivial wrappers, dead abstractions, duplicate helpers, stale comments, and unnecessary ceremony. Verify each removal is safe, make the smallest cleanup, run focused tests and lint, and report what changed with evidence. Inspect every major directory before finishing."
policy:
  allow_implicit_invocation: false
